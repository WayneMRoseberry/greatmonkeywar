# Runs unit tests and data validation on every pull request to main
# (PRD requirement 91). Branch protection on main requires this check to pass
# before a pull request can merge (requirement 92).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Unit tests and data validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
